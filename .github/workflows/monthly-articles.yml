name: Monatliche Artikel-Generierung

on:
  schedule:
    - cron: '0 6 1 * *'  # Jeden 1. des Monats um 06:00 UTC
  workflow_dispatch:      # Manuelle Ausführung möglich

jobs:
  generate-articles:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Dependencies
      run: npm ci
    
    - name: Generate Monthly Articles
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}  
      run: node scripts/monthly-generator.js
    
    - name: Commit and Push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --quiet && git diff --staged --quiet || (git commit -m "feat: monatliche Artikel $(date +%Y-%m)" && git push)
