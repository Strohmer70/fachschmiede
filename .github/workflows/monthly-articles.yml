name: Monatliche Artikel-Generierung

permissions:
  contents: write

on:
  schedule:
    - cron: '0 6 1 * *'  # Jeden 1. des Monats um 06:00 UTC
  workflow_dispatch:      # + manuell

env:
  MAX_ARTICLES_PER_RUN: 5  # Safety-Limit: max 5 Artikel pro Lauf

jobs:
  generate-articles:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Install Dependencies
      run: npm ci
    
    - name: Generate Monthly Articles
      env:
        MAX_ARTICLES_PER_RUN: ${{ env.MAX_ARTICLES_PER_RUN }}
      run: node scripts/monthly-generator.js
    
    - name: Commit and Push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --quiet && git diff --staged --quiet || (git commit -m "feat: monatliche Artikel $(date +%Y-%m) [Template]" && git push)
